<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">
	<ui:define name="title">Categoría Faltante </ui:define>
	<ui:define name="content">
		<h:form id="frm_par_030">
			<p:growl showDetail="false" id="msg"></p:growl>
			<p:panelGrid id="pnl_00" styleClass="fullSize" columns="2"
				columnClasses="ui-grid-col-2,ui-grid-col-2" layout="grid">
				<f:facet name="header">
					<p:row>
						<p:column>
							<div align="left">
								<p:outputLabel value="Categoría Faltante "
									style="font-weight: bold;"></p:outputLabel>
								<p:outputLabel value="par_030.xhtml"
									rendered="#{appMain.usuario.idUsuario eq 1}"></p:outputLabel>
							</div>
						</p:column>
						<p:column>
							<div align="right">
								<p:inputText id="inpBusqueda"
									value="#{CategoriaFaltanteBn.condicion}"></p:inputText>
								<p:commandButton title="Buscar"
									action="#{CategoriaFaltanteBn.buscar()}"
									update="dtbCatFaltante" icon=" pi pi-search"
									styleClass="secondary"></p:commandButton>
							</div>
						</p:column>
					</p:row>
				</f:facet>
			</p:panelGrid>
			<p:dataTable paginator="true" rows="7" reflow="true"
				tableStyle="table-layout: auto" paginatorPosition="bottom"
				emptyMessage="No existe Formatos" id="dtbCatFaltante"
				value="#{CategoriaFaltanteBn.categoriasFaltante}" var="catFaltante">
				<p:column headerText="Orden">
					<h:outputText value="#{catFaltante.orden}"></h:outputText>
				</p:column>
				<p:column headerText="Código">
					<h:outputText value="#{catFaltante.codigo}"></h:outputText>
				</p:column>
				<p:column headerText="Categoría">
					<h:outputText value="#{catFaltante.descripcion}"></h:outputText>
				</p:column>
				<p:column headerText="Tipo Iventario">
					<h:outputText value="#{catFaltante.tipoInventario.descripcion}"></h:outputText>
				</p:column>
				<p:column headerText="Estado">
					<h:outputText value="#{catFaltante.estado.descripcion}"></h:outputText>
				</p:column>
				<p:column width="30">
					<p:commandButton icon="pi pi-pencil" title="Editar"
						action="#{CategoriaFaltanteBn.modificar(catFaltante)}"
						oncomplete="PF('dialog_30_1').show()" update=":frm_par_030_1"></p:commandButton>
				</p:column>
			</p:dataTable>
		</h:form>
		<ui:include src="/pages/parametros/par_030_1.xhtml"></ui:include>
	</ui:define>
</ui:composition>
