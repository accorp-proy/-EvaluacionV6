<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">
	<ui:define name="title">Consulta Plan Acción Faltante Inventario</ui:define>
	<ui:define name="content">
		<h:form id="frm_rpt_020">
			<p:growl showDetail="true" id="mensajes">
			</p:growl>
			<p:fieldset legend="Reporte plan de acción faltante Inventario">
				<div class="col-12">
					<div class="card">
						<div class="ui-fluid formgrid grid">
							<div class="field col-12 md:col-1">
								<p:selectOneMenu id="cmbZona"
									value="#{ConsultaPlanAccionFaltanteInvBn.zonaSeleccionada}"
									converter="#{zonaConverter}">
									<f:selectItem itemLabel="Zona" />
									<f:selectItems
										value="#{ConsultaPlanAccionFaltanteInvBn.tipoZonaList}"
										var="zona" itemLabel="#{zona.nombreZona}" itemValue="#{zona}"></f:selectItems>
									<p:ajax event="change" update="frm_rpt_020:cmbEstacion"></p:ajax>
								</p:selectOneMenu>
							</div>
							<div class="field col-12 md:col-1">
								<p:selectOneMenu id="cmbEstacion"
									value="#{ConsultaPlanAccionFaltanteInvBn.estacionSeleccionada}"
									converter="#{agenciaConverter}" var="t" filter="true"
									filterMatchMode="contains">
									<f:selectItem itemLabel="Estación" />
									<f:selectItems
										value="#{ConsultaPlanAccionFaltanteInvBn.estacionList}"
										var="estacion" itemLabel="#{estacion.nombreAgencia}"
										itemValue="#{estacion}" />
									<p:column>
										<h:outputText value="#{t.nombreAgencia}" />
									</p:column>
								</p:selectOneMenu>
							</div>
							<div class="field col-12 md:col-2">
								<p:selectOneMenu id="cmbEvaluacion"
									value="#{ConsultaPlanAccionFaltanteInvBn.evaluacionSeleccionada}"
									converter="#{evaluacionConverter}">
									<f:selectItem itemLabel="Evaluación" />
									<f:selectItems
										value="#{ConsultaPlanAccionFaltanteInvBn.evaluacionFaltInvList}"
										var="evaluacion" itemValue="#{evaluacion}"
										itemLabel="#{evaluacion.descripcion}" />
								</p:selectOneMenu>
							</div>
							<div class="field col-12 md:col-1">
								<p:calendar value="#{ConsultaPlanAccionFaltanteInvBn.fDesde}"
									placeholder="Fecha Desde" title="Fecha Desde" navigator="true"
									pattern="dd/MM/yyy" locale="es">
								</p:calendar>
							</div>
							<div class="field col-12 md:col-1">
								<p:calendar value="#{ConsultaPlanAccionFaltanteInvBn.fHasta}"
									placeholder="Fecha Hasta" title="Fecha Hasta" navigator="true"
									pattern="dd/MM/yyy" locale="es">
								</p:calendar>
							</div>
							<div class="field col-12 md:col-1">
								<p:selectOneMenu editable="false" title="Estados plan de acción"
									value="#{ConsultaPlanAccionFaltanteInvBn.estadoPlanAccionSeleccionado}">
									<f:selectItems
										value="#{ConsultaPlanAccionFaltanteInvBn.estadoPlanAccion}" />
								</p:selectOneMenu>
							</div>
							<div class="field col-12 md:col-1">
								<p:commandButton title="Botón permite realizar busqueda"
									icon="pi pi-search"
									action="#{ConsultaPlanAccionFaltanteInvBn.buscar()}"
									update="dtbCheckList">
								</p:commandButton>
							</div>
						</div>
					</div>
				</div>
			</p:fieldset>
			<div align="center">
				<p:dataTable paginator="true" rows="7" reflow="true"
					tableStyle="table-layout: auto" paginatorPosition="bottom"
					emptyMessage="No existe Formatos" id="dtbCheckList"
					value="#{ConsultaPlanAccionFaltanteInvBn.checkListEjecuciones}"
					var="checkList">
					<p:column headerText="Código">
						<h:outputText value="#{checkList.checkListEjecucion.codigo}"></h:outputText>
					</p:column>
					<p:column headerText="Fecha Ejecución">
						<h:outputText value="#{checkList.checkListEjecucion.fechaRegistro}">
							<f:convertDateTime pattern="dd-MM-yyyy" />
						</h:outputText>
					</p:column>
					<p:column headerText="Evaluación">
						<h:outputText value="#{checkList.checkListEjecucion.evaluacion.descripcion}"></h:outputText>
					</p:column>
					<p:column headerText="Tipo CheckList">
						<h:outputText value="#{checkList.checkListEjecucion.tipoChecKList.descripcion}"></h:outputText>
					</p:column>
					<p:column headerText="Nivel Evaluación">
						<div align="center">
							<h:outputText value="#{checkList.checkListEjecucion.nivelEvaluacion.descripcion}"></h:outputText>
						</div>
					</p:column>
					<p:column headerText="Plan Acción">
						<h:outputText value="#{checkList.estadoPlanAccion.descripcion}"
							title="El estado en que se encuetra el Plan de acción"></h:outputText>
					</p:column>
					<p:column width="30" headerText="Acción">
						<div align="center">
							
							<p:commandButton title="Descargar en formato PDF"
								rendered="#{checkList.checkListEjecucion.evaluacion.criterio == false}"
								disabled="#{checkList.estadoPlanAccion.descripcion ne 'INGRESADO'}"
								icon="pi pi-file-pdf" immediate="true" ajax="false"
								actionListener="#{ReporteBn.imprimirExcel(31,appMain.usuario.nombreUsuario,checkList.checkListEjecucion.idCheckListEjecucion.toString(),checkList.checkListEjecucion.planificacion.agencia.idAgencia.toString(),null,null,null,null,null,null,null,false)}">
								<p:fileDownload value="#{appMain.download}"></p:fileDownload>
							</p:commandButton>
						</div>
					</p:column>
				</p:dataTable>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
