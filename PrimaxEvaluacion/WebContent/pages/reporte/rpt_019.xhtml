<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">
	<ui:define name="content">
		<h:form id="frm_rpt_019">
			<div class="col-12">
				<div class="card">
					<h5>Reporte de faltante de inventario en estaciones</h5>
					<div class="ui-fluid formgrid grid">
						<div class="field col-12 md:col-2">
							<p:selectOneMenu id="cmbAnio"
								value="#{BusquedaBn.anioSeleccionado}"
								converter="#{parametrosConverter}">
								<f:selectItem itemLabel="Año" />
								<f:selectItems value="#{BusquedaBn.tipoAnioList}" var="anio"
									itemLabel="#{anio.nombreLista}" itemValue="#{anio}"></f:selectItems>
							</p:selectOneMenu>
						</div>
						<div class="field col-12 md:col-2">
							<p:selectCheckboxMenu id="cmbMeses"
								value="#{BusquedaBn.mesesSeleccionados}" label="Meses"
								converter="#{parametrosConverter}" filter="false"
								filterMatchMode="startsWith">
								<f:selectItems value="#{BusquedaBn.tipoMesList}" var="mes"
									itemLabel="#{mes.nombreLista}" itemValue="#{mes}"></f:selectItems>
							</p:selectCheckboxMenu>
						</div>
						<div class="field col-12 md:col-2">
							<p:selectOneMenu id="cmbZona"
								value="#{BusquedaBn.zonaSeleccionada}"
								converter="#{zonaConverter}">
								<f:selectItem itemLabel="Zona" />
								<f:selectItems value="#{BusquedaBn.tipoZonaList}" var="zona"
									itemLabel="#{zona.nombreZona}" itemValue="#{zona}"></f:selectItems>
							</p:selectOneMenu>
						</div>
						<div class="field col-12 md:col-2">
							<p:selectOneMenu id="cmbEvaluacion"
								value="#{BusquedaBn.evaluacionSeleccionada}"
								converter="#{evaluacionConverter}">
								<f:selectItem itemLabel="Evaluación" />
								<f:selectItems value="#{BusquedaBn.evaluacionFaltInvList}"
									var="evaluacion" itemLabel="#{evaluacion.descripcion}"
									itemValue="#{evaluacion}"></f:selectItems>
							</p:selectOneMenu>
						</div>
						<div class="field col-12 md:col-2">
							<p:selectCheckboxMenu id="cmbCatFalt" editable="false"
								label="Categoría" converter="#{categoriaFaltanteConverter}"
								value="#{BusquedaBn.catFaltSeleccionados}">
								<f:selectItems value="#{BusquedaBn.catFaltList}" var="cat"
									itemLabel="#{cat.descripcion}" itemValue="#{cat}"></f:selectItems>
							</p:selectCheckboxMenu>
						</div>
						<div class="field col-12 md:col-1">
							<p:commandButton icon="pi pi-file-pdf"
								action="#{ReporteBn.imprimirPdf()}" process="@this frm_rpt_019"
								update="frm_rpt_019:pnl_rep"
								actionListener="#{BusquedaBn.generarReporte10()}">
							</p:commandButton>
						</div>
						<div class="field col-12 md:col-1">
							<p:commandButton id="buttonExcel" icon="pi pi-file-excel"
								ajax="false" immediate="true" process="@this frm_rpt_019"
								actionListener="#{ReporteBn.imprimirExcel(30,appMain.usuario.idUsuario.toString(),null,null,null,null,null,null,null,null,null,true)}">
								<p:fileDownload value="#{appMain.download}"></p:fileDownload>
							</p:commandButton>
						</div>
					</div>
				</div>
			</div>
			<p:panel id="pnl_rep">
				<div class="container">
					<iframe class="responsive-iframe"
						src="#{request.contextPath}/reporte?rptid=30&amp;p1=#{appMain.usuario.idUsuario.toString()}"></iframe>
				</div>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
